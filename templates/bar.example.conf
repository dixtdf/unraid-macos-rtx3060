# Copy to /boot/config/macos-rtx-bar.conf and set your own BDF/VM name.
# This file is sourced by a root script. Keep it root-owned and not writable by others.
VM_NAME=macos15
GPU_BDF=YOUR_GPU_BDF
AUDIO_BDF=YOUR_AUDIO_BDF
# These IDs scope the helper to the tested RTX 3060 12GB, not all NVIDIA GPUs.
GPU_DEVICE_ID=0x2504
AUDIO_DEVICE_ID=0x228e
